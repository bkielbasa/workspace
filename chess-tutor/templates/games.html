{{template "header" .}}

<div class="page-header">
    <h1>My Games</h1>
    <div class="header-actions">
        <form hx-post="/games/import" hx-target="#games-container" hx-swap="innerHTML" class="inline-form">
            <input type="text" name="username" placeholder="Chess.com username" required>
            <input type="number" name="months" value="3" min="1" max="12" style="width:60px" placeholder="months">
            <button type="submit" class="btn">Import</button>
        </form>
        <form method="POST" action="/games/analyze-all" style="display:inline">
            <button type="submit" class="btn btn-primary">Analyze All Unanalyzed</button>
        </form>
    </div>
</div>

<div id="games-container">
    {{template "games_list" .}}
</div>

{{template "footer" .}}
