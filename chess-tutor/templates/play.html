{{template "header" .}}

<div class="page-header">
    <h1>Play with Tutor</h1>
</div>

<div id="play-layout">
    <div id="board-container">
        <div class="board-wrapper">
            <div id="play-board" data-fen="{{.FEN}}" data-player="{{.PlayerColor}}" data-active="{{.GameActive}}"></div>
        </div>
    </div>

    <div id="play-sidebar" data-fen="{{.FEN}}" data-player="{{.PlayerColor}}" data-active="{{.GameActive}}" data-last="">
        <div class="play-controls">
            <h2>New Game</h2>
            <form hx-post="/play/new" hx-target="#play-sidebar" hx-swap="outerHTML" class="play-form">
                <label>
                    <input type="radio" name="color" value="white" checked> Play as White
                </label>
                <label>
                    <input type="radio" name="color" value="black"> Play as Black
                </label>
                <label class="select-label">
                    Difficulty
                    <select name="difficulty">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced" selected>Advanced</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-primary">Start Game</button>
            </form>
        </div>

        <div id="game-status" class="game-status">
            <p>Start a new game to play against the tutor.</p>
        </div>
    </div>
</div>

<script type="module">
    import { Chessground } from "/static/js/chessground.min.js";
    import { Chess } from "/static/js/chess.js";

    let ground = null;
    let playGame = null;
    let playerColor = "white";

    function setStatusText(text) {
        const el = document.querySelector("#game-status .status-text");
        if (el) el.textContent = text;
    }

    function setBusy(b) {
        if (!ground) return;
        ground.set({ movable: { color: b ? undefined : playerColor } });
    }

    function submitMove(orig, dest, promo) {
        let san = "";
        try {
            const mv = playGame.move({ from: orig, to: dest, promotion: promo });
            san = mv.san;
        } catch (e) {
            console.error("illegal move", orig, dest, promo, e);
            if (ground) ground.set({ fen: playGame.fen() });
            return;
        }
        setBusy(true);
        ground.set({ lastMove: [orig, dest], fen: playGame.fen() });
        setStatusText("Moving " + san + "…");
        window.htmx.ajax("POST", "/play/move", {
            target: "#play-sidebar",
            swap: "outerHTML",
            values: { move: san }
        });
    }

    function postEngineMove() {
        setBusy(true);
        setStatusText("Tutor is thinking…");
        window.htmx.ajax("POST", "/play/engine", {
            target: "#play-sidebar",
            swap: "outerHTML"
        });
    }

    function showPromotionPicker(orig, dest) {
        const overlay = document.createElement("div");
        overlay.className = "promo-overlay";
        const box = document.createElement("div");
        box.className = "promo-picker";
        const whiteGlyphs = { q: "&#9813;", r: "&#9814;", b: "&#9815;", n: "&#9816;" };
        const blackGlyphs = { q: "&#9819;", r: "&#9820;", b: "&#9822;", n: "&#9823;" };
        const glyphs = playerColor === "black" ? blackGlyphs : whiteGlyphs;
        ["q", "r", "b", "n"].forEach(p => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "promo-btn";
            btn.title = p.toUpperCase();
            btn.innerHTML = glyphs[p];
            btn.addEventListener("click", () => {
                overlay.remove();
                submitMove(orig, dest, p);
            });
            box.appendChild(btn);
        });
        overlay.appendChild(box);
        overlay.addEventListener("click", e => {
            if (e.target === overlay) overlay.remove();
        });
        document.body.appendChild(overlay);
    }

    function onMoveAfter(orig, dest) {
        const piece = playGame.get(orig);
        const isPromo = piece && piece.type === "p" &&
            (dest[1] === "8" || dest[1] === "1");
        if (isPromo) {
            showPromotionPicker(orig, dest);
        } else {
            submitMove(orig, dest);
        }
    }

    function maybeEngineReply() {
        if (!playGame) return;
        const active = document.getElementById("play-sidebar")?.dataset.active === "true";
        if (!active) return;
        const turn = playGame.turn();
        const isEngineTurn = turn !== (playerColor === "white" ? "w" : "b");
        if (isEngineTurn) {
            setTimeout(() => {
                if (playGame && playGame.turn() !== (playerColor === "white" ? "w" : "b")) {
                    postEngineMove();
                }
            }, 400);
        }
    }

    function applyServerState() {
        const sidebar = document.getElementById("play-sidebar");
        if (!sidebar || !ground) return;
        try {
            const fen = sidebar.dataset.fen || "";
            playerColor = sidebar.dataset.player || "white";
            const active = sidebar.dataset.active === "true";

            playGame = new Chess(fen);
            const isPlayerTurn = active &&
                playGame.turn() === (playerColor === "white" ? "w" : "b");

            const dests = new Map();
            if (isPlayerTurn) {
                for (const m of playGame.moves({ verbose: true })) {
                    if (m.color !== (playerColor === "white" ? "w" : "b")) continue;
                    if (!dests.has(m.from)) dests.set(m.from, []);
                    dests.get(m.from).push(m.to);
                }
            }

            const last = sidebar.dataset.last || "";
            const lastMove = last.length === 4 ? [last.slice(0, 2), last.slice(2, 4)] : undefined;

            ground.set({
                fen,
                orientation: playerColor,
                turnColor: playGame.turn() === "w" ? "white" : "black",
                check: playGame.inCheck(),
                lastMove: lastMove,
                movable: {
                    free: false,
                    color: isPlayerTurn ? playerColor : undefined,
                    dests,
                    showDests: true,
                    events: { after: onMoveAfter }
                },
                draggable: { enabled: true, showGhost: true },
                selectable: { enabled: true }
            });
            maybeEngineReply();
        } catch (err) {
            console.error("play board update failed:", err);
        }
    }

    function initPlayBoard() {
        const el = document.getElementById("play-board");
        if (!el) return;
        try {
            const fen = el.dataset.fen || "";
            playerColor = el.dataset.player || "white";
            playGame = new Chess(fen);

            ground = Chessground(el, {
                fen,
                orientation: playerColor,
                turnColor: playGame.turn() === "w" ? "white" : "black",
                check: playGame.inCheck(),
                movable: {
                    free: false,
                    color: undefined,
                    dests: new Map(),
                    showDests: true,
                    events: { after: onMoveAfter }
                },
                draggable: { enabled: true, showGhost: true },
                selectable: { enabled: true },
                animation: { enabled: true },
                highlight: { lastMove: true, check: true },
                coordinates: true
            });

            el.classList.remove("play-board-error");
        } catch (err) {
            console.error("play board init failed:", err);
            el.classList.add("play-board-error");
            document.getElementById("play-fallback")?.classList.remove("hidden");
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPlayBoard);
    } else {
        initPlayBoard();
    }

    document.addEventListener("htmx:afterSettle", () => {
        if (document.getElementById("play-sidebar")) applyServerState();
    });

    document.addEventListener("htmx:responseError", () => {
        if (document.getElementById("play-board")) applyServerState();
    });
</script>

{{template "footer" .}}
