{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Tutor</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
    <link rel="stylesheet" href="/static/css/chessground.base.css">
    <link rel="stylesheet" href="/static/css/chessground.brown.css">
    <link rel="stylesheet" href="/static/css/chessground.cburnett.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
    var exploreGameId = null;
    var currentMoveIdx = -1;

    function getBoardWrapperGameId() {
        var bw = document.querySelector('.board-wrapper[data-game-id]');
        return bw ? parseInt(bw.dataset.gameId) : null;
    }

    function moveRowCount() {
        return document.querySelectorAll('.move-row').length;
    }

    function updateEvalBar(fen, evalVal) {
        var fill = document.getElementById('eval-bar-fill');
        var label = document.getElementById('eval-bar-label');
        if (!fill || !label) return;
        var parts = fen.split(' ');
        var sideToMove = parts[1] === 'b' ? 'b' : 'w';
        var whiteEval = evalVal;
        if (sideToMove === 'b') whiteEval = -evalVal;
        var pct = 100 / (1 + Math.pow(10, -whiteEval / 4));
        pct = Math.max(2, Math.min(98, pct));
        fill.style.height = pct + '%';
        label.textContent = (evalVal >= 0 ? '+' : '') + evalVal.toFixed(2);
    }

    function syncFromDOM() {
        var fenEl = document.getElementById('fen-output');
        if (!fenEl || !fenEl.dataset.fen) return;
        var fen = fenEl.dataset.fen;
        window.fenStr = fen;
        updateEvalBar(fen, parseFloat(fenEl.dataset.eval || '0'));
        if (window.chessBoard) window.chessBoard.position(fen);
    }

    function updateNavPosition() {
        var pos = document.getElementById('nav-position');
        if (!pos) return;
        var total = moveRowCount();
        if (currentMoveIdx < 0) {
            pos.textContent = 'Start';
        } else {
            pos.textContent = (currentMoveIdx + 1) + ' / ' + total;
        }
    }

    function setActiveMove(row) {
        var rows = document.querySelectorAll('.move-row');
        for (var i = 0; i < rows.length; i++) {
            rows[i].classList.remove('active');
        }
        if (row) row.classList.add('active');
    }

    function navTo(idx) {
        var rows = document.querySelectorAll('.move-row');
        var total = rows.length;
        if (total === 0) return;
        if (idx < -1) idx = -1;
        if (idx > total - 1) idx = total - 1;
        currentMoveIdx = idx;
        if (idx === -1) {
            setActiveMove(null);
            var startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
            window.fenStr = startFen;
            if (window.chessBoard) window.chessBoard.position(startFen);
            updateEvalBar(startFen, 0);
            var sidebar = document.getElementById('board-sidebar');
            if (sidebar) {
                sidebar.innerHTML = '<span id="fen-output" data-fen="' + startFen + '" data-eval="0.00"></span>' +
                    '<div class="board-info-card"><div class="board-info"><span class="move-label"><span class="move-icon">♞</span>Start position</span></div></div>';
            }
        } else {
            rows[idx].click();
            setActiveMove(rows[idx]);
        }
        updateNavPosition();
    }

    function navStart() { navTo(-1); }
    function navPrev() { navTo(currentMoveIdx - 1); }
    function navNext() { navTo(currentMoveIdx + 1); }
    function navEnd() { navTo(moveRowCount() - 1); }

    function initBoard(fen) {
        var boardEl = document.getElementById('board');
        if (!boardEl) return;
        window.fenStr = fen;
        exploreGameId = getBoardWrapperGameId();
        var isExplore = exploreGameId !== null;
        if (window.chessBoard) {
            window.chessBoard.destroy();
            window.chessBoard = null;
        }
        var cfg = {
            position: fen,
            pieceTheme: '/static/pieces/{piece}.svg'
        };
        if (isExplore) {
            cfg.draggable = true;
            cfg.dropOffBoard = 'snapback';
            cfg.onDrop = function(source, target, piece, newPos, oldPos, orientation) {
                var uci = source + target;
                var currentFen = window.fenStr || fen;
                fetch('/games/' + exploreGameId + '/explore', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'fen=' + encodeURIComponent(currentFen) + '&move=' + encodeURIComponent(uci)
                }).then(function(resp) {
                    if (!resp.ok) {
                        window.chessBoard.position(currentFen);
                        throw new Error('server rejected');
                    }
                    return resp.text();
                }).then(function(html) {
                    if (html) {
                        var sidebar = document.getElementById('board-sidebar');
                        if (sidebar) sidebar.innerHTML = html;
                        syncFromDOM();
                    }
                }).catch(function(e) {
                    window.chessBoard.position(currentFen);
                });
            };
        }
        window.chessBoard = Chessboard('board', cfg);
    }

    document.addEventListener('DOMContentLoaded', function() {
        var fenEl = document.getElementById('fen-output');
        if (fenEl) {
            initBoard(fenEl.dataset.fen);
            syncFromDOM();
        }
        currentMoveIdx = moveRowCount() - 1;
        updateNavPosition();
    });

    var resizeTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            if (window.chessBoard && window.chessBoard.resize) {
                window.chessBoard.resize();
                syncFromDOM();
            }
        }, 150);
    });

    document.addEventListener('htmx:afterSwap', function(evt) {
        var fenEl = document.getElementById('fen-output');
        if (fenEl && fenEl.dataset.fen) {
            initBoard(fenEl.dataset.fen);
            syncFromDOM();
        }
    });

    document.addEventListener('click', function(evt) {
        var row = evt.target.closest('.move-row');
        if (row && row.dataset.idx !== undefined) {
            currentMoveIdx = parseInt(row.dataset.idx);
            setActiveMove(row);
            updateNavPosition();
        }
    });
    </script>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">♟ Chess Tutor</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/games" class="nav-link">Games</a>
                <a href="/play" class="nav-link">Play</a>
                <a href="/practice" class="nav-link">Practice</a>
                <a href="/feedback" class="nav-link">Feedback</a>
                <a href="/progress" class="nav-link">Progress</a>
                <a href="/openings" class="nav-link">Openings</a>
            </div>
        </div>
    </nav>
    <main class="container">
{{end}}

{{define "footer"}}
    </main>
</body>
</html>
{{end}}
