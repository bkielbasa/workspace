server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://lgtm:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Picks up a server started outside compose, e.g.
  #   go run . 2>&1 | tee logs/workspace.log
  - job_name: workspace-host
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          level:
    static_configs:
      - targets: ['localhost']
        labels:
          job: workspace
          service: workspace
          __path__: /var/log/workspace/*.log
