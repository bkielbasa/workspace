apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "workspace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workspace.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          args:
            - "-source=file:///migrations"
            - "-database=$(DATABASE_URL)"
            - "-verbose"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: workspace
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: smtp
              containerPort: 2525
            - name: smtps
              containerPort: 2465
            - name: imap
              containerPort: 1143
            - name: imaps
              containerPort: 1993
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
            {{- if and .Values.tls.enabled .Values.tls.secretName }}
            - name: TLS_CERT_FILE
              value: "/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/certs/tls.key"
            {{- end }}
            {{- if .Values.dkim.enabled }}
            - name: DKIM_DOMAIN
              value: {{ .Values.dkim.domain | quote }}
            - name: DKIM_SELECTOR
              value: {{ .Values.dkim.selector | quote }}
            - name: DKIM_PRIVATE_KEY_FILE
              value: "/dkim/dkim_private.key"
            {{- end }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            {{- if and .Values.tls.enabled .Values.tls.secretName }}
            - name: tls
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if .Values.dkim.enabled }}
            - name: dkim
              mountPath: /dkim
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "workspace.fullname" . }}-migrations
        {{- if and .Values.tls.enabled .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.dkim.enabled }}
        - name: dkim
          secret:
            secretName: {{ .Values.dkim.secretName }}
        {{- end }}
