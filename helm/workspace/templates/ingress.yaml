{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" . }}
                port:
                  name: http
    {{- range .Values.ingress.extraHosts }}
    - host: {{ . }}
      http:
        paths:
          {{- range (list "/autodiscover/autodiscover.xml" "/.well-known/") }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- range .Values.ingress.extraHosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.tls.secretName }}
{{- end }}