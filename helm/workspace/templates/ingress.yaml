{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" . }}
                port:
                  name: http
    {{- range .Values.ingress.appHosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" $ }}
                port:
                  name: http
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ . }}
      http:
        paths:
          {{- /*
            Discovery paths served on the autodiscover/autoconfig hosts.
            Thunderbird requests /mail/config-v1.1.xml on the autoconfig host,
            which is not under /.well-known/, so it needs its own rule.
            /apple/ serves the configuration profile: on the LAN the mail host
            resolves to the mail LoadBalancer, which has no HTTPS port, so the
            profile has to be reachable on the discovery hosts too.
          */}}
          {{- range (list "/autodiscover/" "/.well-known/" "/mail/config-v1.1.xml" "/apple/" "/dav/" "/cal/" "/files/") }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
    {{- /*
      The DAV hostname doubles as a files endpoint: clients pointed at the
      bare host land on their tree root. Longest-prefix matching keeps the
      specific paths above ahead of this fallback. Skipped when the DAV host
      is already covered by the main rules (same host serves / there).
    */}}
    {{- $dav := (.Values.davHost | default .Values.mailHost) }}
    {{- $covered := list .Values.ingress.host }}
    {{- range .Values.ingress.appHosts }}{{ $covered = append $covered . }}{{ end }}
    {{- if not (has $dav $covered) }}
    - host: {{ $dav }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "workspace.fullname" $ }}
                port:
                  name: http
    {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- range .Values.ingress.appHosts }}
        - {{ . }}
        {{- end }}
        {{- range .Values.ingress.extraHosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.tls.secretName }}
{{- end }}