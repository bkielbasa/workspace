apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workspace.fullname" . }}-migrations
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
data:
  001_users.up.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email TEXT NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        display_name TEXT NOT NULL,
        enabled BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX users_email_idx ON users(email);

  002_mailboxes.up.sql: |
    CREATE TABLE mailboxes (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        name TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        UNIQUE(user_id, name)
    );

    CREATE INDEX mailboxes_user_id_idx ON mailboxes(user_id);

  003_messages.up.sql: |
    CREATE TABLE messages (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        mailbox_id UUID NOT NULL REFERENCES mailboxes(id) ON DELETE CASCADE,
        message_id TEXT,
        sender TEXT NOT NULL,
        recipients TEXT[] NOT NULL DEFAULT '{}',
        subject TEXT,
        in_reply_to TEXT,
        references_header TEXT,
        raw_message TEXT NOT NULL,
        mime_type TEXT,
        charset TEXT,
        size_bytes BIGINT NOT NULL DEFAULT 0,
        seen BOOLEAN NOT NULL DEFAULT FALSE,
        flagged BOOLEAN NOT NULL DEFAULT FALSE,
        answered BOOLEAN NOT NULL DEFAULT FALSE,
        deleted BOOLEAN NOT NULL DEFAULT FALSE,
        draft BOOLEAN NOT NULL DEFAULT FALSE,
        received_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        sent_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX messages_mailbox_id_idx ON messages(mailbox_id);
    CREATE INDEX messages_message_id_idx ON messages(message_id);
    CREATE INDEX messages_received_at_idx ON messages(received_at DESC);
    CREATE INDEX messages_sender_idx ON messages(sender);

  004_outbox.up.sql: |
    CREATE TABLE IF NOT EXISTS outbox (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        recipient TEXT NOT NULL,
        data TEXT NOT NULL,
        attempts INT NOT NULL DEFAULT 0,
        next_attempt_at TIMESTAMP NOT NULL DEFAULT NOW(),
        created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_outbox_next_attempt ON outbox (next_attempt_at);

  005_uids.up.sql: |
    ALTER TABLE messages ADD COLUMN IF NOT EXISTS uid BIGSERIAL;
    CREATE INDEX IF NOT EXISTS idx_messages_mailbox_uid ON messages (mailbox_id, uid);

  006_contacts.up.sql: |
    CREATE TABLE IF NOT EXISTS contacts (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        email TEXT NOT NULL,
        name TEXT,
        etag TEXT NOT NULL,
        updated_at TIMESTAMP NOT NULL DEFAULT NOW(),
        created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_user_email ON contacts(user_id, email);

  007_events.up.sql: |
    CREATE TABLE IF NOT EXISTS events (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        title TEXT,
        starts_at TIMESTAMP NOT NULL,
        ends_at TIMESTAMP NOT NULL,
        etag TEXT NOT NULL,
        updated_at TIMESTAMP NOT NULL DEFAULT NOW(),
        created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_events_user ON events(user_id);

  008_threads.up.sql: |
    ALTER TABLE messages ADD COLUMN IF NOT EXISTS thread_id UUID;
    CREATE INDEX IF NOT EXISTS idx_messages_thread ON messages(thread_id);

  009_labels.up.sql: |
    CREATE TABLE IF NOT EXISTS labels (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        name TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS message_labels (
        message_id UUID NOT NULL,
        label_id UUID NOT NULL,
        PRIMARY KEY (message_id, label_id)
    );

    CREATE INDEX IF NOT EXISTS idx_labels_user ON labels(user_id);

  010_mailbox_uid_validity.up.sql: |
    ALTER TABLE mailboxes ADD COLUMN IF NOT EXISTS uid_validity BIGINT NOT NULL DEFAULT 1;

  010_mailbox_uid_validity.down.sql: |
    ALTER TABLE mailboxes DROP COLUMN IF EXISTS uid_validity;

  011_domains.up.sql: |
    CREATE TABLE IF NOT EXISTS domains (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS domains_name_idx ON domains (name);

  012_aliases.up.sql: |
    CREATE TABLE IF NOT EXISTS aliases (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        domain_id UUID NOT NULL REFERENCES domains (id) ON DELETE CASCADE,
        address TEXT NOT NULL,
        destination TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS aliases_address_idx ON aliases (address);
    CREATE INDEX IF NOT EXISTS aliases_domain_id_idx ON aliases (domain_id);

  013_sessions.up.sql: |
    CREATE TABLE IF NOT EXISTS sessions (
        token_hash TEXT PRIMARY KEY,
        user_id UUID NOT NULL REFERENCES users (id) ON DELETE CASCADE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        expires_at TIMESTAMPTZ NOT NULL,
        last_seen_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS sessions_user_id_idx ON sessions (user_id);
    CREATE INDEX IF NOT EXISTS sessions_expires_at_idx ON sessions (expires_at);

  014_contacts_vcard.up.sql: |
    ALTER TABLE contacts
        ADD COLUMN IF NOT EXISTS first_name TEXT,
        ADD COLUMN IF NOT EXISTS last_name TEXT,
        ADD COLUMN IF NOT EXISTS company TEXT,
        ADD COLUMN IF NOT EXISTS title TEXT,
        ADD COLUMN IF NOT EXISTS phone TEXT,
        ADD COLUMN IF NOT EXISTS vcard TEXT NOT NULL DEFAULT '';

    -- One contact per primary email, but allow multiple contacts without an
    -- email (phone-only vCards from CardDAV clients).
    DROP INDEX IF EXISTS idx_contacts_user_email;
    CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_user_email
    ON contacts (user_id, email) WHERE email <> '';

  015_contacts_multi_value.up.sql: |
    -- A contact can hold several emails and phones (vCard TEL/EMAIL list).
    -- Each entry is {"value": "...", "type": ["HOME","INTERNET",...]} and keeps
    -- the original vCard header for faithful re-serialisation.
    ALTER TABLE contacts
        ADD COLUMN IF NOT EXISTS emails JSONB NOT NULL DEFAULT '[]',
        ADD COLUMN IF NOT EXISTS phones JSONB NOT NULL DEFAULT '[]';

    UPDATE contacts SET
        emails = CASE
            WHEN email <> '' THEN jsonb_build_array(
                jsonb_build_object('value', email, 'type', jsonb_build_array('INTERNET'))
            )
            ELSE '[]'::jsonb
        END
    WHERE emails = '[]'::jsonb AND email <> '';

    UPDATE contacts SET
        phones = CASE
            WHEN phone IS NOT NULL AND phone <> '' THEN jsonb_build_array(
                jsonb_build_object('value', phone, 'type', jsonb_build_array('CELL', 'VOICE'))
            )
            ELSE '[]'::jsonb
        END
    WHERE phones = '[]'::jsonb AND phone IS NOT NULL AND phone <> '';

  016_events_caldav.up.sql: |
    -- CalDAV clients (iOS, DAVx5) address an event by the resource name in the
    -- PUT URL (often not a UUID) and expect to GET it back byte-for-byte at that
    -- same href. Store the raw iCalendar body, the client UID, and the resource
    -- name; let times be optional so all-day / floating / recurring events
    -- (which we do not model) still round trip. starts_at/ends_at remain only as
    -- a best-effort index for the web UI.
    ALTER TABLE events
        ADD COLUMN IF NOT EXISTS ics TEXT,
        ADD COLUMN IF NOT EXISTS uid TEXT,
        ADD COLUMN IF NOT EXISTS resource TEXT;

    ALTER TABLE events ALTER COLUMN starts_at DROP NOT NULL;
    ALTER TABLE events ALTER COLUMN ends_at DROP NOT NULL;

    -- Web-created rows use their uuid as the resource name; back-fill so every
    -- row has one before the uniqueness index is added.
    UPDATE events SET resource = id::text WHERE resource IS NULL;

    CREATE UNIQUE INDEX IF NOT EXISTS idx_events_user_resource
        ON events (user_id, resource);


