# Persistent storage for user files served over WebDAV (/files/).
# Single-node cluster: ReadWriteOnce is enough; the app is a singleton.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workspace.fullname" . }}-data
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "20Gi" | quote }}
