{{- if .Values.samba.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workspace.fullname" . }}-smb
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: smb
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "workspace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: smb
  template:
    metadata:
      labels:
        {{- include "workspace.labels" . | nindent 8 }}
        app.kubernetes.io/component: smb
    spec:
      containers:
        - name: samba
          image: "{{ .Values.samba.image.repository }}:{{ .Values.samba.image.tag }}"
          imagePullPolicy: {{ .Values.samba.image.pullPolicy }}
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: smb-conf
              mountPath: /etc/samba/smb.conf
              subPath: smb.conf
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: smb
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: smb
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "workspace.fullname" . }}-data
        - name: smb-conf
          configMap:
            name: {{ include "workspace.fullname" . }}-smb
{{- end }}
