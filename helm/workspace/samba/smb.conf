# Standalone Samba for workspace Drive files.
#
# One static share serves every user: %U expands per connection to the
# login name, which matches the on-disk home directories the app creates
# (lowercase emails). No per-user config, no reloads on user changes.
# Authentication is smbpasswd-only; the app maintains that file.
[global]
	workgroup = CLOUDLIFT
	server string = workspace files
	server role = standalone server
	security = user
	map to guest = never

	passdb backend = smbpasswd:/data/samba/smbpasswd
	obey pam restrictions = no
	# NTLMv2 only; iOS and macOS speak it.
	ntlm auth = ntlmv2-only
	# SMB2 minimum (SMB1 stays off); SMB3 encryption negotiated.
	server min protocol = SMB2
	smb encrypt = desired

	# Apple clients (Finder, Files app): translate illegal characters and
	# keep resource forks in xattrs. If the underlying export ever lacks
	# xattr support, switch fruit:metadata to netatalk.
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:encoding = native

	load printers = no
	printcap name = /dev/null
	disable spoolss = yes
	log level = 1

[files]
	comment = workspace Drive
	path = /data/files/%U
	browseable = yes
	read only = no
	guest ok = no
	# The app and Samba both run as root, so ownership never fights.
	force user = root
	force group = root
	create mask = 0644
	directory mask = 0755
	hide dot files = yes
	wide links = no
	follow symlinks = no
