image:
  repository: bartlomiejklimczak/workspace
  tag: latest
  pullPolicy: IfNotPresent

# DATABASE_URL is injected via secret (see databaseUrlSecret).
# Set databaseUrlSecret.name to a k8s Secret with key DATABASE_URL.
databaseUrlSecret:
  name: workspace-db
  key: DATABASE_URL

# TLS certificate secret (cert-manager issues this via the ingress).
# The app uses these for direct TLS on mail ports (SMTPS/IMAPS).
tls:
  secretName: workspace-tls
  # Set to false to disable TLS on mail ports (plain SMTP/IMAP only).
  enabled: true

# DKIM signing. Create a k8s Secret with key `dkim_private.key` and set secretName.
dkim:
  enabled: false
  secretName: workspace-dkim
  domain: ""
  selector: "default"

# HTTP ingress (nginx, for web API / CardDAV / CalDAV / autoconfig)
ingress:
  enabled: true
  className: nginx
  host: mail.cloudlift.run
  # Additional hosts that serve the full app (root path), e.g. the apex domain.
  appHosts: []
  # Additional hosts needed only for the client-discovery endpoints
  # (Outlook autodiscover, Mozilla/Apple autoconfig). CNAME these
  # subdomains to the main host in the public zone.
  extraHosts: []
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# LoadBalancer Service for raw TCP mail ports.
# On this cluster MetalLB assigns 192.168.1.30.
mailService:
  enabled: true
  type: LoadBalancer
  annotations: {}
  # Ports exposed: 25 (SMTP), 587 (submission), 465 (SMTPS), 143 (IMAP),
  # 993 (IMAPS). 587/STARTTLS is what mail clients default to when an account
  # is configured by hand.
  # Maps standard external ports → non-privileged container ports.
  ports:
    smtp:
      port: 25
      targetPort: 2525
    submission:
      port: 587
      targetPort: 2587
    smtps:
      port: 465
      targetPort: 2465
    imap:
      port: 143
      targetPort: 1143
    imaps:
      port: 993
      targetPort: 1993

resources: {}

# Migrations init container runs `migrate up` before the app starts.
migrate:
  image: migrate/migrate:latest

# Prometheus scraping: labels the HTTP Service for the cluster's
# auto-discovery ServiceMonitor (port `http`, path /metrics).
metrics:
  enabled: true

# Canonical hostname advertised in autoconfig/autodiscover responses.
# Leave empty to fall back to the request Host header (local dev only).
mailHost: ""

# User files served over WebDAV at /files/. Quotas are bytes.
files:
  dataDir: /data/files
  quotaBytes: "10737418240"
  maxFileBytes: "1073741824"

# Photo library served over WebDAV at /photos/ plus the gallery UI.
# A separate tree (and PVC path) so libraries never mix with files.
photos:
  dataDir: /data/photos

# Persistent volume for user files. NFS-backed so files survive node
# changes; Retain policy keeps data if the claim is ever deleted.
# ReadWriteMany: the app and Samba mount it together.
persistence:
  storageClass: "qnap-nfs"
  accessMode: ReadWriteMany
  size: 20Gi

# Standalone Samba file server for native clients (iOS Files, Finder).
# Credentials come from the smbpasswd file the app maintains.
# Disabled: file sharing is served over WebDAV instead.
samba:
  enabled: false
  serviceType: LoadBalancer
  annotations: {}
  image:
    repository: bartlomiejklimczak/workspace-samba
    tag: latest
    pullPolicy: IfNotPresent
