{{define "content"}}<section class="upload-page">
  <div class="upload-card card">
    <div class="upload-icon" aria-hidden="true">📤</div>
    <h1 class="upload-title">Add photos</h1>
    <p class="subtitle">They appear in Photos, sorted by month.</p>
    <form action="/api/upload" method="post" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <label class="btn upload-btn" for="upload-input">Choose photos</label>
      <input type="file" id="upload-input" name="files" multiple hidden accept="image/*,video/*" data-autosubmit>
    </form>
    <p class="field-hint">You can pick many at once. Stay on this page until Photos opens.</p>
    {{if .Error}}<div class="compose-error drive-error" role="alert">{{.Error}}</div>{{end}}
  </div>
</section>
<script src="/static/js/drive.js"></script>
{{end}}
