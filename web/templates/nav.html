{{define "nav"}}<nav class="nav">
  <a class="nav-brand" href="/">Workspace</a>
  <div class="nav-links">
    <a href="/" {{if eq .Section "home"}}aria-current="page"{{end}}>Home</a>
    <a href="/mail" {{if eq .Section "mail"}}aria-current="page"{{end}}>Mail</a>
    <a href="/contacts" {{if eq .Section "contacts"}}aria-current="page"{{end}}>Contacts</a>
    <a href="/calendars" {{if eq .Section "calendars"}}aria-current="page"{{end}}>Calendars</a>
    <a href="/profile" {{if eq .Section "profile"}}aria-current="page"{{end}}>Profile</a>
  </div>
  <div class="nav-user">
    {{if .User}}<a href="/profile" class="nav-user-link" {{if eq .Section "profile"}}aria-current="page"{{end}} title="Account profile">{{if .User.DisplayName}}{{.User.DisplayName}}{{else}}{{.User.Email}}{{end}}</a>{{end}}
    <form class="inline-form" hx-post="/logout" hx-swap="none">
      <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
    </form>
  </div>
</nav>
{{end}}
